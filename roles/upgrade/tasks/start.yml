
- name: "Load disk password"
  include_vars:
    file: disk_password.yml
  no_log: true

- name: "mount data disk"
  shell: echo "{{ data_password }}" | /usr/bin/mount-data-drives && btrfs filesystem show /data
  no_log: true

- name: "start docker"
  systemd:
    name: docker
    state: started

- name: "start samba service"
  systemd: 
    name: smb
    state: started

- name: "Start transmission-daemon service"
  systemd: 
    name: transmission-daemon
    state: started

- name: "Start urbackup service"
  systemd: 
    name: urbackup-server
    state: started

- name: "start wireguard"
  community.docker.docker_compose_v2:
    project_src: /data/wireguard
    pull: "always"

- name: "start plex"
  community.docker.docker_compose_v2:
    project_src: /data/plex
    pull: "always"

- name: "start streamline with force build"
  community.docker.docker_compose_v2:
    project_src: /data/streamline
    build: "always"
    pull: "always"

- name: "check mosquitto compose file"
  stat:
    path: /data/mosquitto/docker-compose.yml
  register: mosquitto_compose_file

- name: "ensure the shared mqtt network"
  include_role:
    name: ha-monitor
    tasks_from: network.yml
  when: mosquitto_compose_file.stat.exists

- name: "start mosquitto"
  community.docker.docker_compose_v2:
    project_src: /data/mosquitto
    pull: "always"
  when: mosquitto_compose_file.stat.exists

- name: "start homeassistant"
  community.docker.docker_compose_v2:
    project_src: /data/homeassistant
    pull: "always"

- name: "start gpb"
  community.docker.docker_compose_v2:
    project_src: /data/gpb
    pull: "always"

- name: Prune dangling images
  community.docker.docker_prune:
    images: true
