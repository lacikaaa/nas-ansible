- name: Ensure streamline directory exists
  file:
    path: /data/streamline
    state: directory

- name: Ensure bazarr user exists
  user:
    name: bazarr
    uid: 505
    group: "{{ samba_group }}"
    home: /data/bazarr
    create_home: no
    shell: /bin/bash

- name: Ensure bazarr config directory exists
  file:
    path: /data/bazarr
    state: directory
    owner: bazarr
    group: "{{ samba_group }}"
    mode: "2770"

- name: Ensure flood user exists
  user:
    name: flood
    uid: 506
    group: "{{ samba_group }}"
    home: /data/flood
    create_home: no
    shell: /usr/sbin/nologin

- name: Ensure flood config directory exists
  file:
    path: /data/flood
    state: directory
    owner: flood
    group: "{{ samba_group }}"
    mode: "2770"

- name: "copy Dockerfile-radarr to host"
  copy: 
    src: /{{ role_path }}/files/Dockerfile-radarr
    dest: /data/streamline/Dockerfile-radarr

- name: "copy Dockerfile-sonarr to host"
  copy: 
    src: /{{ role_path }}/files/Dockerfile-sonarr
    dest: /data/streamline/Dockerfile-sonarr

- import_tasks: correct_location.yml

- name: "copy streamline compose file"
  template:
    src: docker-compose-streamline.yml.j2
    dest: /data/streamline/docker-compose.yml

- name: "start streamline with force build"
  community.docker.docker_compose_v2:
    project_src: /data/streamline
    build: "always"
    pull: "always"
