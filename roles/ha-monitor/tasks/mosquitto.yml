- name: "Ensure mosquitto directories exist"
  file:
    path: "/data/mosquitto{{ item }}"
    state: directory
    owner: "1883"
    group: "1883"
    mode: 0755
  loop:
    - ""
    - /config
    - /data
    - /log

- name: "copy mosquitto.conf"
  template:
    src: mosquitto.conf.j2
    dest: /data/mosquitto/config/mosquitto.conf
    owner: "1883"
    group: "1883"
    mode: 0644
  register: mosquitto_conf

- name: "copy mosquitto acl"
  template:
    src: acl.j2
    dest: /data/mosquitto/config/acl
    owner: "1883"
    group: "1883"
    mode: 0600
  register: mosquitto_acl

- import_tasks: network.yml

- name: "copy mosquitto compose file"
  template:
    src: docker-compose-mosquitto.yml.j2
    dest: /data/mosquitto/docker-compose.yml
  register: mosquitto_compose

- name: "Check mosquitto password file"
  stat:
    path: /data/mosquitto/config/passwd
  register: mosquitto_passwd_file

- name: "Check mosquitto password hash file"
  stat:
    path: /data/mosquitto/config/passwd.sha256
  register: mosquitto_passwd_hash_file

- name: "Read stored mosquitto password hash"
  slurp:
    src: /data/mosquitto/config/passwd.sha256
  register: mosquitto_passwd_hash
  when: mosquitto_passwd_hash_file.stat.exists
  no_log: true

# mosquitto_passwd -U hashes a plain user:password file in place, so the passwords never reach a command line.
# passwd.sha256 holds a hash of that plain text, to tell when a user or password changed.
- name: "Create mosquitto password file"
  when: >-
    not mosquitto_passwd_file.stat.exists
    or not mosquitto_passwd_hash_file.stat.exists
    or (mosquitto_passwd_hash.content | b64decode | trim) != (mosquitto_passwd_plain | hash('sha256'))
  vars:
    mosquitto_passwd_plain: |
      {% for c in mqtt_clients %}
      {{ c.user }}:{{ c.password }}
      {% endfor %}
  block:
    - name: "Write plain mosquitto password file"
      copy:
        content: "{{ mosquitto_passwd_plain }}"
        dest: /data/mosquitto/config/passwd
        owner: "1883"
        group: "1883"
        mode: 0600
      no_log: true

    - name: "Hash mosquitto password file"
      command: >-
        docker run --rm -v /data/mosquitto/config:/mosquitto/config
        {{ mosquitto_image }}
        mosquitto_passwd -U /mosquitto/config/passwd
      register: mosquitto_passwd_created

    - name: "Store mosquitto password hash"
      copy:
        content: "{{ mosquitto_passwd_plain | hash('sha256') }}\n"
        dest: /data/mosquitto/config/passwd.sha256
        owner: root
        group: root
        mode: 0600
      no_log: true
  rescue:
    - name: "Remove the unhashed mosquitto password file"
      file:
        path: /data/mosquitto/config/passwd
        state: absent

    - name: "Fail after removing the unhashed password file"
      fail:
        msg: "Hashing /data/mosquitto/config/passwd failed, the plain file was removed. Re-run the playbook."

- name: "Fix mosquitto password file permissions"
  file:
    path: /data/mosquitto/config/passwd
    owner: "1883"
    group: "1883"
    mode: 0600

# The marker keeps a pending recreate across a run that fails before the broker is started.
- name: "Mark mosquitto for recreate"
  copy:
    content: ""
    dest: /data/mosquitto/.recreate
    mode: 0600
  when: mosquitto_conf is changed or mosquitto_acl is changed or mosquitto_compose is changed or mosquitto_passwd_created is changed

- name: "Check mosquitto recreate marker"
  stat:
    path: /data/mosquitto/.recreate
  register: mosquitto_recreate

- name: "start mosquitto"
  community.docker.docker_compose_v2:
    project_src: /data/mosquitto
    pull: "always"
    recreate: "{{ 'always' if mosquitto_recreate.stat.exists else 'auto' }}"

- name: "Remove mosquitto recreate marker"
  file:
    path: /data/mosquitto/.recreate
    state: absent
