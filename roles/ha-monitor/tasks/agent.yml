- name: "copy nas-ha-agent to host"
  copy:
    src: /{{ role_path }}/files/nas-ha-agent
    dest: /usr/local/sbin/nas-ha-agent
    owner: root
    group: root
    mode: 0755

- name: "copy nas-ha-agent config to host"
  template:
    src: nas-ha-agent.json.j2
    dest: /etc/nas-ha-agent.json
    owner: root
    group: root
    mode: 0600
  no_log: true

- name: "copy nas-ha-agent service to host"
  template:
    src: nas-ha-agent.service.j2
    dest: /etc/systemd/system/nas-ha-agent.service
    owner: root
    group: root
    mode: 0644

- name: "copy nas-ha-agent timer to host"
  template:
    src: nas-ha-agent.timer.j2
    dest: /etc/systemd/system/nas-ha-agent.timer
    owner: root
    group: root
    mode: 0644

- name: "Enable and start nas-ha-agent timer"
  systemd:
    name: nas-ha-agent.timer
    daemon_reload: yes
    enabled: yes
    state: started
