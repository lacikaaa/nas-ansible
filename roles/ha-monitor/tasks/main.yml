- name: "Check /data is mounted"
  command: mountpoint -q /data
  register: data_mounted
  changed_when: false
  failed_when: false

- name: "Fail when /data is not mounted"
  assert:
    that: data_mounted.rc == 0
    fail_msg: "/data is not mounted, unlock it with mount-data-drives first"

- name: "Check mqtt password file exists"
  stat:
    path: "{{ role_path }}/vars/mqtt_password.yml"
  delegate_to: localhost
  become: false
  register: mqtt_password_file

- name: "Fail when mqtt password file is missing"
  assert:
    that: mqtt_password_file.stat.exists
    fail_msg: "Missing roles/ha-monitor/vars/mqtt_password.yml, copy mqtt_password.yml.example and set a password"

- name: "Load mqtt password"
  include_vars:
    file: mqtt_password.yml
  no_log: true

- name: "Fail when an mqtt password is missing"
  assert:
    that:
      - mqtt_password is defined
      - mqtt_homeassistant_password is defined
      - mqtt_gpb_password is defined
    fail_msg: "roles/ha-monitor/vars/mqtt_password.yml needs mqtt_password, mqtt_homeassistant_password and mqtt_gpb_password, see mqtt_password.yml.example"

# No loop here: a failed loop item is printed whole, password included.
- name: "Fail when an mqtt password is a placeholder, too short or more than one line"
  assert:
    that: weak_mqtt_users | trim == ''
    fail_msg: "Set a one-line password of at least 12 characters (not CHANGE_ME) for mqtt user(s) {{ weak_mqtt_users | trim }} in roles/ha-monitor/vars/mqtt_password.yml"
    quiet: true
  vars:
    weak_mqtt_users: >-
      {% for c in mqtt_clients if c.password == 'CHANGE_ME' or c.password | string | length < 12 or '\n' in c.password | string or '\r' in c.password | string %}{{ c.user }} {% endfor %}

- name: "Fail when mqtt users share a password"
  assert:
    that: mqtt_clients | map(attribute='password') | unique | length == mqtt_clients | length
    fail_msg: "Each mqtt user needs its own password in roles/ha-monitor/vars/mqtt_password.yml"
    quiet: true

- import_tasks: mosquitto.yml
- import_tasks: agent.yml
